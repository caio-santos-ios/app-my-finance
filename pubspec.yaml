name: finance
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  smooth_page_indicator: ^3.0.0
  dio: ^5.10.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  brasil_fields: ^1.19.0
  pinput: ^6.0.2
  font_awesome_flutter: ^11.0.0
  animated_bottom_navigation_bar: ^1.4.1
  jwt_decoder: ^2.0.1
  intl: ^0.20.2
  flutter_localization: ^0.4.1
  flutter_riverpod: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo-secondary.png
    - assets/images/onboarding-1.png
    - assets/images/onboarding-2.png
    - assets/images/onboarding-3.png
    - assets/images/onboarding-4.png

    - assets/icons/icon.png

